<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching Memory Games</title>
    <link rel="stylesheet" href="matching.css">
</head>
<body>
    <div class="game">
        <div class='controls'>
            <button class="button" id="startButton">Start</button>
            <button class="button" id="pauseButton" disabled>Pause</button>
            <button class="button" id="stopButton" disabled>Stop</button>
            <button class="button" id="restartButton" disabled>Restart</button>

            <div class="stats">
                <div class="moves">0 moves</div>
                <div class="timer">Time : 0 sec</div>
            </div> 
        </div>

        <div class="board-container">
            <div class="board" data-dimension="4"></div>
            <div class="win">You Win!</div>
        </div>
    </div>

    <script src="matching.js" defer></script>
</body>
</html>
